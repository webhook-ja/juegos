<script>/* Monetag TMA ads helper (main zone 12014079) */window.ADS=(function(){var Z='show_12014079',CAP=15;
function k(){return 'ads_'+new Date().toISOString().slice(0,10)}
function n(){try{return +(localStorage.getItem(k())||0)}catch(e){return 0}}function inc(){try{localStorage.setItem(k(),n()+1)}catch(e){}}
function uid(){try{var u=Telegram.WebApp.initDataUnsafe.user;if(u&&u.id)return 'tg-'+u.id+'-'+Date.now()}catch(e){}return 'web-'+Date.now()}
function ok(){return typeof window[Z]==='function'&&n()<CAP}
function valued(r){return !!(r&&r.reward_event_type==='valued')}
function reward(tag){if(!ok())return Promise.resolve(false);inc();var id=uid();
return window[Z]({type:'preload',ymid:id}).then(function(){return window[Z]({ymid:id,requestVar:tag})}).then(valued).catch(function(){return false})}
function pop(tag){if(!ok())return Promise.resolve(false);inc();return window[Z]({type:'pop',ymid:uid(),requestVar:tag}).then(valued).catch(function(){return false})}
function inter(){if(!ok())return Promise.resolve();inc();return window[Z]({type:'preload'}).then(function(){return window[Z]()}).then(function(){},function(){})}
function inApp(){if(typeof window[Z]!=='function')return;window[Z]({type:'inApp',inAppSettings:{frequency:1,capping:0.5,interval:180,timeout:30,everyPage:false}}).catch(function(){})}
try{window.Telegram&&Telegram.WebApp&&Telegram.WebApp.ready()}catch(e){}
return{ok:ok,reward:reward,pop:pop,inter:inter,inApp:inApp}})();</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batalla Vending</title><style>
*{box-sizing:border-box}body{margin:0;background:#3f8f3a;font-family:"Arial Black",sans-serif;display:flex;justify-content:center;user-select:none}
#g{width:420px;height:100vh;max-height:760px;position:relative;background:#5fb34d;overflow:hidden}
.top{display:flex;gap:8px;padding:8px}.pill{background:#26302a;color:#fff;border-radius:14px;padding:4px 12px;font-size:16px}
#lane{position:absolute;top:200px;left:0;right:0;height:120px;background:#8a5a3b;border-top:6px solid #6d4429;border-bottom:6px solid #6d4429}
.base{position:absolute;top:150px;width:70px;height:170px;border-radius:12px;border:4px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;z-index:3}
#b0{left:4px;background:linear-gradient(#4aa3ff,#1f6fd1)}#b1{right:4px;background:linear-gradient(#ff6b6b,#c1121f)}
.base .hp{position:absolute;top:-26px;color:#fff;font-size:16px;text-shadow:0 2px 0 #000}
.base .scr{width:46px;height:50px;background:#bfefff;border-radius:6px;border:3px solid #222;font-size:22px;display:flex;align-items:center;justify-content:center}
.u{position:absolute;font-size:30px;transition:none;z-index:4;text-align:center}.u.e{transform:scaleX(-1)}
.u .bar{height:4px;background:#3fbf2a;border-radius:2px}
.fx{position:absolute;font-size:22px;color:#fff;-webkit-text-stroke:1px #c1121f;animation:up .6s forwards;z-index:9}@keyframes up{to{transform:translateY(-30px);opacity:0}}
#spells{position:absolute;bottom:170px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.sp{width:64px;height:64px;border-radius:14px;border:3px solid #222;font-size:32px;box-shadow:0 5px 0 #222;cursor:pointer}
.cards{position:absolute;bottom:10px;left:96px;right:8px;display:flex;gap:8px}
.card{flex:1;height:140px;background:#fff6e0;border:4px solid #222;border-radius:14px;box-shadow:0 6px 0 #222;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px;font-size:40px;cursor:pointer}
.card small{font-size:12px}.card b{font-size:14px;background:#ffd27a;border-radius:8px;padding:2px 8px}
.card:active,.sp:active{transform:translateY(5px);box-shadow:0 1px 0 #222}.off{opacity:.45}
#food{position:absolute;bottom:20px;left:10px;width:80px;height:80px;border-radius:50%;background:#26302a;color:#ffd23f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;border:4px solid #ffd23f}
#end{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;flex-direction:column;align-items:center;justify-content:center;color:#ffd23f;font-size:48px;z-index:20;text-align:center}
#end button{font:inherit;font-size:22px;margin-top:20px;padding:12px 30px;border-radius:16px;border:3px solid #222;background:linear-gradient(#7cf25a,#3fbf2a);color:#fff;box-shadow:0 6px 0 #222}
</style></head><body><div id="g">
<div class="top"><div class="pill">🪙 <span id="gd">0</span></div><div class="pill">Batalla 1</div></div>
<div id="lane"></div>
<div class="base" id="b0"><div class="hp" id="h0">400</div><div class="scr">🥤</div>TU</div>
<div class="base" id="b1"><div class="hp" id="h1">400</div><div class="scr">👾</div>CPU</div>
<div id="spells"><button class="sp" id="ice" style="background:#9fe7ff">🧊</button><button class="sp" id="fire" style="background:#ff9f5a">🔥</button></div>
<div id="food">🍫<span id="fd">50</span></div>
<div class="cards">
<div class="card" data-k="0">🧃<small>Lata</small><b>🍫 20</b></div>
<div class="card" data-k="1">🍟<small>Patatón</small><b>🍫 35</b></div>
<div class="card" data-k="2">🤖<small>Robot Vending</small><b>🍫 80</b></div></div>
<div id="end"><div id="et"></div><button onclick="location.reload()">OTRA VEZ</button><button id="adrv" style="display:none">📺 VER ANUNCIO Y REVIVIR</button></div>
</div><script>
const K=[{c:20,hp:40,d:8,s:1.1,r:26},{c:35,hp:70,d:12,s:.8,r:26},{c:80,hp:200,d:25,s:.5,r:30}];
const E=['👻','👺','🧟'];const G=g,W=420,LT=210;let food=50,gold=0,hp=[400,400],units=[],frozen=0,over=false,A;
function snd(f,d,t='square'){A=A||new AudioContext();const o=A.createOscillator(),q=A.createGain();o.type=t;o.frequency.value=f;q.gain.setValueAtTime(.12,A.currentTime);q.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(q).connect(A.destination);o.start();o.stop(A.currentTime+d)}
function spawn(side,k){const t=K[k],el=document.createElement('div');el.className='u'+(side?' e':'');el.innerHTML=(side?E[k]:['🧃','🍟','🤖'][k])+'<div class="bar"></div>';
const y=LT+Math.random()*70;el.style.top=y+'px';G.appendChild(el);units.push({side,x:side?W-90:70,y,hp:t.hp,max:t.hp,d:t.d,s:t.s,r:t.r,el,cd:0})}
function fx(x,y,txt){const f=document.createElement('div');f.className='fx';f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';G.appendChild(f);setTimeout(()=>f.remove(),600)}
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const k=+c.dataset.k;if(over||food<K[k].c)return;food-=K[k].c;spawn(0,k);snd(600,.1)});
ice.onclick=()=>{if(food<40||over)return;food-=40;frozen=120;snd(1500,.3,'sine');units.filter(u=>u.side).forEach(u=>fx(u.x,u.y,'❄'))};
fire.onclick=()=>{if(food<50||over)return;food-=50;snd(120,.4,'sawtooth');units.filter(u=>u.side&&u.x<300).forEach(u=>{u.hp-=60;fx(u.x,u.y,'🔥')})};
let tick=0;function loop(){if(over)return;tick++;if(tick%6==0)food=Math.min(250,food+1);
if(tick%Math.max(70,150-tick/40|0)==0)spawn(1,Math.random()<.6?0:Math.random()<.75?1:2);
if(frozen>0)frozen--;
for(const u of units){const foes=units.filter(o=>o.side!=u.side&&o.hp>0);const dir=u.side?-1:1;
const tgt=foes.find(o=>Math.abs(o.x-u.x)<u.r);const baseX=u.side?75:W-110;
if(u.side&&frozen>0)continue;
if(tgt||Math.abs(u.x-baseX)<10){if(u.cd--<=0){u.cd=30;if(tgt){tgt.hp-=u.d;fx(tgt.x,tgt.y-10,'-'+u.d)}else{hp[1-u.side]-=u.d;snd(150,.08)}}}
else u.x+=dir*u.s;}
units=units.filter(u=>{if(u.hp<=0){u.el.remove();if(u.side){gold+=5;snd(1100,.1,'sine')}return false}u.el.style.left=u.x+'px';u.el.querySelector('.bar').style.width=(u.hp/u.max*30)+'px';u.el.style.filter=u.side&&frozen?'hue-rotate(180deg) brightness(1.3)':'';return true});
h0.textContent=Math.max(0,hp[0]);h1.textContent=Math.max(0,hp[1]);fd.textContent=food;gd.textContent=gold;
document.querySelectorAll('.card').forEach(c=>c.classList.toggle('off',food<K[+c.dataset.k].c));ice.classList.toggle('off',food<40);fire.classList.toggle('off',food<50);
if(hp[0]<=0||hp[1]<=0){over=true;end.style.display='flex';et.innerHTML=hp[1]<=0?'¡VICTORIA!<br>🪙 +'+(gold+100):'DERROTA';snd(hp[1]<=0?800:100,.8,'triangle');adrv.style.display=(hp[0]<=0&&ADS.ok()&&!window._rv)?'':'none';return}
requestAnimationFrame(loop)}loop();
adrv.onclick=async()=>{adrv.disabled=true;if(await ADS.reward('batalla_revive')){window._rv=1;hp[0]=200;over=false;end.style.display='none';loop()}adrv.disabled=false;adrv.style.display='none'};
</script></body></html>
