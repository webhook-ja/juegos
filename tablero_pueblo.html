function towers(a,done,boost){const L=5,COLS=9,CW=60,CH=56,W=COLS*CW,H=L*CH,DUR=45;a.innerHTML=`<div><span class="pill">☀️ <b class="sun">${boost?150:100}</b></span><span class="pill">⏱️ <b class="tm">${DUR}</b></span></div><canvas width="${W}" height="${H}" style="max-width:100%;border:4px solid #1a1c28;border-radius:14px;margin-top:6px;cursor:pointer"></canvas>`;
const cv=a.querySelector('canvas'),x=cv.getContext('2d');let sun=boost?150:100,plants=[],zs=[],peas=[],t0=performance.now(),last=t0,nextZ=2,sunT=0,raf,over=false;
cv.onclick=e=>{const r=cv.getBoundingClientRect(),c=Math.floor((e.clientX-r.left)*W/r.width/CW),l=Math.floor((e.clientY-r.top)*H/r.height/CH);if(c>=COLS-1||sun<50||plants.some(p=>p.c==c&&p.l==l))return;sun-=50;plants.push({c,l,hp:6,cd:.5});snd(800,.08)};
function end(w){if(over)return;over=true;cancelAnimationFrame(raf);done(w)}
function step(now){if(over)return;const dt=Math.min(.05,(now-last)/1000);last=now;const el=(now-t0)/1000;
sunT+=dt;if(sunT>=2){sunT=0;sun+=25}if(el>=nextZ&&el<DUR-4){zs.push({l:Math.floor(Math.random()*L),x:W,hp:5,sp:14+el*.35});nextZ=el+Math.max(1.6,4.5-el*.07)}
plants.forEach(p=>{p.cd-=dt;if(p.cd<=0&&zs.some(z=>z.l==p.l&&z.x>p.c*CW)){p.cd=1.3;peas.push({l:p.l,x:p.c*CW+45})}});
peas.forEach(p=>{p.x+=220*dt;const z=zs.find(z=>z.l==p.l&&Math.abs(z.x-p.x)<18);if(z){z.hp--;p.dead=1;if(z.hp<=0){z.dead=1;snd(300,.1)}}if(p.x>W)p.dead=1});
zs.forEach(z=>{const pl=plants.find(p=>p.l==z.l&&z.x-(p.c*CW+CW)<4&&z.x>p.c*CW);if(pl){pl.hp-=dt*1.5;if(pl.hp<=0)pl.dead=1}else z.x-=z.sp*dt;if(!z.dead&&z.hp>0&&z.x< -20){a.querySelector('.tm').textContent='¡Un zombi llegó!';end(false)}});
peas=peas.filter(p=>!p.dead);zs=zs.filter(z=>!z.dead);plants=plants.filter(p=>!p.dead);
for(let l=0;l<L;l++)for(let c=0;c<COLS;c++){x.fillStyle=(l+c)%2?'#7ccf4a':'#9be060';x.fillRect(c*CW,l*CH,CW,CH)}
x.font='34px serif';x.textAlign='center';x.textBaseline='middle';
plants.forEach(p=>x.fillText('🌻',p.c*CW+CW/2,p.l*CH+CH/2));x.fillStyle='#3fbf2a';peas.forEach(p=>{x.beginPath();x.arc(p.x,p.l*CH+CH/2,7,0,7);x.fill();x.strokeStyle='#1a1c28';x.lineWidth=2;x.stroke()});
zs.forEach(z=>{x.fillText('🧟',z.x,z.l*CH+CH/2);x.fillStyle='#e63946';x.fillRect(z.x-15,z.l*CH+4,6*z.hp,5)});
a.querySelector('.sun').textContent=sun;a.querySelector('.tm').textContent=Math.max(0,Math.ceil(DUR-el));
if(el>=DUR&&!over){end(true);return}if(!over)raf=requestAnimationFrame(safe)}
function safe(now){try{step(now)}catch(e){console.error(e);if(!over)raf=requestAnimationFrame(safe)}}
raf=requestAnimationFrame(safe);return()=>{over=true;cancelAnimationFrame(raf)}}

else{$('mgi').textContent=info[name][1];

cleanup();res.textContent=w?'¡GANA! +200 +2🎟 🏆':'PIERDE -100 😵';snd(w?1200:150,.4);await wait(1500);mg.style.display='none';ar.innerHTML='';return{w,boost,dbl}}
return{play}})();

async function turn(p){const n=1+Math.floor(Math.random()*6);dice.classList.remove('roll');void dice.offsetWidth;dice.classList.add('roll');dice.textContent='⚀⚁⚂⚃⚄⚅'[n-1];

const t=T[pos[p]],who=p?"New Bot":"Tú";let m=who+' cae en '+t[2]+'. ';
if(t[3]){if(own[pos[p]]===undefined){let tk=false;const can=money[p]>=t[3]&&(p==0?confirm('¿Comprar '+t[2]+' por '+t[3]+'?'):money[p]-t[3]>=300);if(!can&&money[p]<t[3]&&tok[p]>=(p?2:1)&&(p==0?confirm('No te llega. ¿Comprar '+t[2]+' con 1 🎟 + todo tu dinero ('+money[p]+')?'):true))tk=true;if(can||tk){if(tk){tok[p]--;money[p]=0;m+='(con 🎟) '}else money[p]-=t[3];own[pos[p]]=p;els[pos[p]].classList.add("own"+p);els[pos[p]].querySelector("small").innerHTML+="<br>"+(p?"🔵 New Bot":"🔴 Tuya");m+='¡Comprada!';snd(900,.3)}}
else if(own[pos[p]]!=p){const rent=Math.round(t[3]*(t[0]=='vend'?.5:.25));if(tok[p]>0&&(p==0?confirm('Alquiler de '+rent+'. ¿Usar 1 🎟 para no pagar?'):tok[p]>=2&&money[p]<rent)){tok[p]--;m+='Usa 1 🎟 y no paga alquiler.'}else{money[p]-=rent;money[own[pos[p]]]+=rent;m+='Paga '+rent+' de alquiler.'}snd(200,.3)}}
else if(t[0]=='coin'){money[p]+=100;m+='+100 monedas';snd(1000,.2)}
else if(t[0]=='gift'){tok[p]++;m+='+1🎟 ';const g=50+Math.floor(Math.random()*150);money[p]+=g;m+='Regalo: +'+g}
else if(t[0]=='chance'){const c=await luckCard(p);m+='Carta '+c.i+' '+c.t+': ';
if(c.k=='tok'){tok[p]=Math.max(0,tok[p]+c.v);m+=(c.v>0?'+':'')+c.v+'🎟'}
else if(c.k=='money'){money[p]+=c.v;m+=(c.v>0?'+':'')+c.v}
else if(c.k=='move'){for(let i=0;i<c.v;i++){pos[p]=(pos[p]+1)%N;if(pos[p]==0){money[p]+=200;tok[p]++}place(p);snd(600+i*80,.08);await new Promise(r=>setTimeout(r,220))}m+='avanza '+c.v+' hasta '+T[pos[p]][2]}
else if(c.k=='mini'){const nmg=['Gimnasio','Puzzles','Memoria','Torres'][Math.floor(Math.random()*4)];const r=await MG.play(nmg,p,tok[p]);if(r.boost)tok[p]--;const w=r.w;money[p]+=w?(r.dbl?400:200):-100;if(w)tok[p]+=2;m+=nmg+': '+(w?'¡gana! +200 +2🎟':'pierde -100')}
snd(900,.2)}
else if(t[0]=='lot'){tok[p]++;m+='+1🎟 ';const g=Math.random()<.3?300:-50;money[p]+=g;m+='Lotería: '+(g>0?'+':'')+g}
else if(t[0]=='mini'){const r=await MG.play(t[2],p,tok[p]);if(r.boost)tok[p]--;const w=r.w;money[p]+=w?(r.dbl?400:200):-100;if(w)tok[p]+=2;m+=t[2]+(r.dbl?' 📺x2':'')+(r.boost?' (🎟 boost)':'')+': '+(w?'¡gana! +200 +2🎟':'pierde -100');snd(w?1100:180,.3)}
else if(t[0]=='jail'){money[p]-=50;m+='Multa de 50'}
upd();msg.textContent=m;
if(money[p]<0){msg.textContent=who+' se ha arruinado. ¡Fin de la partida!';return true}}
