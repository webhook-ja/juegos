<script>/* dado 3D d12 (solo animacion; el resultado ya viene decidido) */
(function(){let R,S,C,M,faces,ok=null;const ov=document.getElementById('d3');
function setup(){if(ok!==null)return ok;try{if(!window.THREE)return ok=false;
const W=Math.min(innerWidth,700),H=Math.min(innerHeight*.7,560);R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(W,H);ov.appendChild(R.domElement);
S=new THREE.Scene();C=new THREE.PerspectiveCamera(40,W/H,.1,100);C.position.set(0,0,11);
S.add(new THREE.AmbientLight(0xffffff,.55));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,5,6);S.add(dl);
const g=new THREE.DodecahedronGeometry(1.25,0).toNonIndexed();const pos=g.attributes.position;const tris=pos.count/3;
// agrupar triangulos por normal -> 12 caras
faces=[];const v=new THREE.Vector3(),a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();
for(let t=0;t<tris;t++){a.fromBufferAttribute(pos,t*3);b.fromBufferAttribute(pos,t*3+1);c.fromBufferAttribute(pos,t*3+2);const n=new THREE.Vector3().subVectors(c,b).cross(new THREE.Vector3().subVectors(a,b)).normalize();
let f=faces.find(f=>f.n.dot(n)>.99);if(!f){f={n,cen:new THREE.Vector3(),k:0};faces.push(f)}f.cen.add(a).add(b).add(c);f.k+=3}
faces.forEach(f=>f.cen.divideScalar(f.k));
M=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xe63946,roughness:.35,metalness:.1,flatShading:true}));S.add(M);
M.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,10),new THREE.LineBasicMaterial({color:0x5a0f16})));
faces.forEach((f,i)=>{const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');x.fillStyle='#fff';x.font='bold 64px Arial Black,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(i+1,64,68);if(i==5||i==8){x.fillRect(40,104,48,6)}
const pl=new THREE.Mesh(new THREE.PlaneGeometry(.78,.78),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));pl.position.copy(f.cen).addScaledVector(f.n,.01);pl.lookAt(f.cen.clone().add(f.n));M.add(pl)});
return ok=true}catch(e){console.warn('dado3d',e);return ok=false}}
const ease=t=>1-Math.pow(1-t,3);
window.DICE3D=function(n){if(!setup())return Promise.resolve(false);
return new Promise(res=>{ov.style.display='flex';const f=faces[n-1];
const qFace=new THREE.Quaternion().setFromUnitVectors(f.n,new THREE.Vector3(0,0,1));
const qTw=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),(Math.random()-.5)*.6);const qEnd=qTw.multiply(qFace);
const ax=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),spin=Math.PI*(6+Math.random()*3);
const dir=Math.random()<.5?-1:1,T=1500*(window.DICE_SLOW||1),t0=performance.now();
(function fr(){let t=Math.min(1,(performance.now()-t0)/T);
// rebotes: 3 parabolas con amortiguacion
const bt=[0,.38,.66,.84,1],hs=[2.6,1.1,.45,.15];let y=0;for(let i=0;i<4;i++)if(t>=bt[i]&&t<bt[i+1]){const u=(t-bt[i])/(bt[i+1]-bt[i]);y=hs[i]*4*u*(1-u)*(i==0?1:1)+(i==0?(1-u)*1.5:0)}
M.position.set(dir*4.5*(1-ease(t)),-0.6+y,0);
const q=new THREE.Quaternion().setFromAxisAngle(ax,spin*(1-ease(Math.min(1,t*1.08))));M.quaternion.copy(q).multiply(qEnd);
const sq=t>.38&&t<.42||t>.66&&t<.69?.93:1;M.scale.set(1,sq,1);
R.render(S,C);if(t<1)requestAnimationFrame(fr);else setTimeout(()=>{ov.style.display="none";res(true)},380)})()})}})();</script>
