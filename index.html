<script>/* cartas de evento + animacion de dinero (solo presentacion) */
(function(){const ev=document.getElementById('ev'),C=document.getElementById('evc');const NM=new Proxy([],{get:(o,k)=>isNaN(k)?o[k]:PN(+k)});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function center(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function bankPt(){return[innerWidth/2,-30]}
async function flight(from,to,n,ico){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='fly';d.textContent=ico;d.style.left=(from[0]-12)+'px';d.style.top=(from[1]-12)+'px';document.body.appendChild(d);
requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform='translate('+(to[0]-from[0]+(Math.random()-.5)*20)+'px,'+(to[1]-from[1])+'px) rotate('+(Math.random()*360)+'deg)';}));setTimeout(()=>d.remove(),850);await wait(70)}await wait(600)}
function tween(el,a,b){const t0=performance.now();return new Promise(r=>{(function f(){const k=Math.min(1,(performance.now()-t0)/600);el.textContent=Math.round(a+(b-a)*k);k<1?requestAnimationFrame(f):r()})()})}
async function moneyFx(bm){const d=money.map((v,i)=>v-(bm[i]||0)),E=i=>document.getElementById('m'+i),jobs=[];
const neg=[],gp=[];d.forEach((v,i)=>{if(v<0)neg.push(i);if(v>0)gp.push(i)});
if(neg.length&&gp.length){neg.forEach(i=>gp.forEach(k=>{if(E(i)&&E(k))jobs.push(flight(center(E(i)),center(E(k)),6,'💵'))}))}
else{d.forEach((v,i)=>{if(!E(i))return;if(v>0)jobs.push(flight(bankPt(),center(E(i)),Math.min(8,2+v/50|0),'🪙'));if(v<0)jobs.push(flight(center(E(i)),bankPt(),Math.min(8,2+(-v)/50|0),'💸'))})}
await Promise.all(jobs);await Promise.all(d.map((v,i)=>v&&E(i)?tween(E(i),bm[i],money[i]):0))}
const money_=[()=>money[0],()=>money[1]];
const KIND={house:['🏡','TIERRAS'],vend:['🍺','NEGOCIO DEL REINO'],gift:['🧰','COFRE'],lot:['🔮','ORÁCULO'],coin:['💰','TESORO'],jail:['⛓️','MAZMORRA'],mini:['✨','PRUEBA MÁGICA'],go:['🏰','PUERTA DEL REINO'],park:['🌲','BOSQUE']};
window.EVCARD=async function(p,t,m,bm,bt){try{const dm=money.map((v,i)=>v-(bm[i]||0)),dt=tok.map((v,i)=>v-(bt[i]||0)),q=own[pos[p]]!=null&&own[pos[p]]!==p?own[pos[p]]:(dm.findIndex((v,i)=>i!==p&&v>0));
if(t[0]=='chance'){if(dm[0]||dm[1])await moneyFx(bm);return}
if(!dm[0]&&!dm[1]&&!dt[0]&&!dt[1]&&t[0]=='park')return;
const k=(window.THEME&&THEME.kind(t[0]))||KIND[t[0]]||['📜','EVENTO'];const lines=[];let amt='',stamp='',cls='';
const rent=dm[p]<0&&dm[q]>0;
if(rent){lines.push(NM[p]+(p?' paró':' paraste')+' en '+t[2]+' de '+NM[q]+'.');lines.push('→ '+(p?'Paga ':'Pagas ')+(-dm[p])+' 🪙 a '+NM[q]);amt='-'+(-dm[p])+' 🪙';stamp='PAGADO';cls='bank'}
else if(t[3]&&own[pos[p]]===p&&dm[p]<0){lines.push(NM[p]+(p?' compra ':' compras ')+t[2]+'.');lines.push('→ Nueva propiedad de '+NM[p]);amt='-'+(-dm[p])+' 🪙';stamp='VENDIDO';cls='note'}
else{m.split(/(?<=[.!?])\s+/).filter(Boolean).forEach(x=>lines.push(x));if(dm[p])amt=(dm[p]>0?'+':'')+dm[p]+' 🪙';if(dt[p])amt+=(amt?'  ':'')+(dt[p]>0?'+':'')+dt[p]+' 🎟';stamp=dm[p]<0?'COBRADO':(dm[p]>0||dt[p]>0)?'¡PREMIO!':'VISTO';cls=dm[p]<0?'bad':''}
C.className=cls;C.innerHTML='<div class="eh"><b>'+k[0]+'</b>'+k[1]+'</div>'+lines.map(()=>'<div class="el"></div>').join('')+(amt?'<div class="amt"></div>':'')+(cls=='bank'?'<div class="serial">VT-'+String(Date.now()).slice(-7)+'</div>':'')+'<div class="stamp">'+stamp+'</div>'+(p?'':'<div class="tap">Toca para continuar</div>');
ev.style.display='flex';const els=C.querySelectorAll('.el');
for(let i=0;i<lines.length;i++){for(const ch of lines[i]){els[i].textContent+=ch;await wait(16)}await wait(90)}
if(amt){C.querySelector('.amt').textContent=amt}C.querySelector('.stamp').classList.add('on');try{snd(dm[p]<0?220:900,.12)}catch(e){}
const mv=moneyFx(bm);
await new Promise(r=>{if(p){setTimeout(r,2000)}else{ev.onclick=()=>{ev.onclick=null;r()}}});ev.style.display='none';await mv}catch(e){console.warn(e);ev.style.display='none'}}})();</script>

rev=r0;R.on=true;try{AV.load(nr.players.map(p=>p.id))}catch(e){}try{THEME.room(nr.state.theme)}catch(e){}try{VT_CHAT.setRoom(nr.status==='over'?null:code,nr.status==='playing')}catch(e){}
if(nr.status==='waiting'){applyArrays(nr.state);lobbyWait();return}
ov.style.display='none';try{if(nr.status==='playing'&&(first||prevStatus==='waiting'))vtTrack('game_start','tablero');if(nr.status==='over'&&prevStatus==='playing'){vtTrack('game_end','tablero');try{const v=JSON.parse(localStorage.getItem('vt_pvp')||'[]');v.push({d:Date.now(),won:nr.state.winner===mySeat,code});localStorage.setItem('vt_pvp',JSON.stringify(v.slice(-200)))}catch(e){}}}catch(e){}
animating=animating.then(async()=>{if(!first&&old&&old.status==='playing'&&!busy)await animateRemote(nr);applyArrays(nr.state);players();upd();for(let i=0;i<S;i++)place(i);if(nr.state.log)msg.textContent=nr.state.log;
if(nr.status==='over'&&prevStatus!=='over')msg.textContent='🏆 Partida terminada. Gana '+(nr.players[nr.state.winner]?.name||'?')});}
R.refresh=()=>{if(row)players()};R.myTurn=()=>row&&row.status==='playing'&&row.turn===mySeat;
R.roll=async()=>{const r=await api({action:'roll',code});if(r.error){msg.textContent='⚠ '+r.error;return 0}return r.n};
R.commit=async()=>{const st={money:[],tok:[],pos:[],own:{},houses:{},log:msg.textContent.slice(0,300)};for(let i=0;i<S;i++){st.money[G(i)]=money[i];st.tok[G(i)]=tok[i];st.pos[G(i)]=pos[i]}
Object.entries(own).forEach(([k,v])=>st.own[k]=G(+v));Object.entries(houses).forEach(([k,v])=>st.houses[k]=v);if(window._lastMG)st.mg=window._lastMG;window._lastMG=null;window.MGOPP=null;
st.log=st.log.replace(/\bTú\b/g,myName).replace(/\bcae\b/,'cae');const r=await api({action:'commit',code,state:st});if(r.error)msg.textContent='⚠ '+r.error};
// ---------- minijuegos 1v1 ----------
let tapCb=null,mgCleanup=null;
R.mgOpts=id=>{const opp=S>1?1:0;window.MGOPP=opp;const og=G(opp),op=row.players[og],seed=(Math.random()*2**31)|0;window._lastMG={id,a:mySeat,b:og};
chan&&chan.send({type:'broadcast',event:'mg',payload:{id,seed,a:mySeat,b:og}});
return{seed,opponent:{name:op.name,avatarUrl:op.avatar,remote:true,send:ev=>chan&&chan.send({type:'broadcast',event:'tap',payload:{from:mySeat,ev}}),onEvent:cb=>{tapCb=cb}}}};
function remoteMG(p){if(p.b!==mySeat)return;const a=row.players[p.a];const mg=$('mg'),ar=$('mga');if(mgCleanup)try{mgCleanup()}catch(e){}
$('mgt').textContent='⚔ Duelo contra '+a.name;$('mgi').textContent='¡Te ha retado! Juega a la vez.';$('mgr').textContent='';ar.innerHTML='';mg.style.display='flex';
mgCleanup=PartyMG.mount(p.id,ar,w=>{$('mgr').textContent=w?'¡Has ganado tu parte! 🏆':'Has perdido 😵';setTimeout(()=>{if(mgCleanup){try{mgCleanup()}catch(e){}mgCleanup=null}mg.style.display='none'},1800)},false,{seed:p.seed,playerName:myName,avatarUrl:myAv,opponent:{name:a.name,avatarUrl:a.avatar,remote:true,send:ev=>chan&&chan.send({type:'broadcast',event:'tap',payload:{from:mySeat,ev}}),onEvent:cb=>{tapCb=cb}}})}
// ---------- conexion ----------
async function join(c){const r=await api({action:'join',code:c,theme:window.THEME?THEME.pref():'fantasia'});if(r.error){localStorage.removeItem('vt_room');lobbyHome(r.error==='room not found'?'Sala no encontrada':r.error);return}
code=c;localStorage.setItem('vt_room',c);if(!sb)sb=supabase.createClient(SURL,KEY);
chan=sb.channel('room:'+c,{config:{presence:{key:String(me)},broadcast:{self:false}}});
chan.on('postgres_changes',{event:'UPDATE',schema:'public',table:'game_rooms',filter:'code=eq.'+c},p=>onRow(p.new))
.on('broadcast',{event:'mg'},m=>remoteMG(m.payload)).on('broadcast',{event:'tap'},m=>{if(tapCb)tapCb(m.payload.ev)})
.on('presence',{event:'sync'},()=>{online={};Object.keys(chan.presenceState()).forEach(k=>online[k]=1);if(row){row.status==='waiting'?lobbyWait():players()}})
.subscribe(async s=>{if(s==='SUBSCRIBED'){chan.track({name:myName});const {data}=await sb.from('game_rooms').select('*').eq('code',c).maybeSingle();rev=-1;row=null;onRow(data)}})}
// saltar turno si el jugador activo no responde
setInterval(()=>{if(!row||row.status!=='playing'||row.turn===mySeat)return;const p=row.players[row.turn];const age=Date.now()-new Date(row.updated_at).getTime();if(age>90000||(age>60000&&!online[p.id]))api({action:'skip',code})},15000);
R.enter=()=>{if(code)return;let sp='';try{sp=tg.initDataUnsafe.start_param||''}catch(e){}const m=/^room_([A-Z0-9]{5,6})$/i.exec(sp);const c=m?m[1].toUpperCase():localStorage.getItem('vt_room');
if(c)join(c);else lobbyHome()};
})();
</script>

<script>/* feedback de dinero: cada cambio de saldo se ve y se oye (solo visual) */
(function(){let AC=null;const ac=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC};
function tone(f,t0,d,type,v){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.02)}
function noise(t0,d,v,hp){const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=hp;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}
const register=()=>{noise(0,.08,.25,3000);tone(1568,.06,.5,'triangle',.12);tone(2093,.12,.6,'triangle',.1);[0,.05,.1].forEach(t=>tone(2600+Math.random()*600,.2+t,.08,'square',.03))};
const lose=()=>{noise(0,.35,.18,800);tone(900,0,.12,'triangle',.1);tone(600,.1,.15,'triangle',.08);tone(380,.22,.25,'sine',.08)};
let last=null,lastT=null;const Q=[];let running=false;
function el(i,k){return document.getElementById((k?'k':'m')+i)}
async function run(){if(running)return;running=true;while(Q.length){const e=Q.shift(),E=el(e.i,e.k);if(!E)continue;const r=E.getBoundingClientRect();
const lab=document.createElement('div');lab.className='mfx '+(e.d>0?'g':'r');lab.textContent=(e.d>0?'+':'')+e.d+(e.k?' 🎟':' 🪙');lab.style.left=(r.left+r.width/2)+'px';lab.style.top=(r.top-6)+'px';document.body.appendChild(lab);setTimeout(()=>lab.remove(),1500);
if(e.i===0)(e.d>0?register:lose)();E.classList.remove('mpulse-g','mpulse-r');void E.offsetWidth;E.classList.add(e.d>0?'mpulse-g':'mpulse-r');
await new Promise(r=>setTimeout(r,400));const t0=performance.now(),a=e.from,b=e.to;await new Promise(res=>{(function f(){const k=Math.min(1,(performance.now()-t0)/650);const v=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));E.textContent=k<1?v:b;k<1?requestAnimationFrame(f):res()})()});
if(!e.k){const cur=window.money&&money[e.i];if(cur!=null)E.textContent=cur}await new Promise(r=>setTimeout(r,250))}running=false}
