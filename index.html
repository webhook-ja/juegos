<script>(function(){
const D={idle:['Reposo',0],saludo:['Saludo',50],balanceo:['Balanceo',60],baile:['Baile del pueblo',150],giro:['Giro',80],saltitos:['Saltitos',70],pose:['Pose de mago',120],siesta:['Siesta',50]};
const CAP=10,EXTRA=30,DAY=864e5;
const J=()=>{try{return JSON.parse(localStorage.getItem('vt_dance_rent')||'{}')}catch(e){return{}}},SV=o=>localStorage.setItem('vt_dance_rent',JSON.stringify(o));
const coins=()=>+localStorage.getItem('vt_coins')||0,pay=n=>{if(coins()<n)return false;localStorage.setItem('vt_coins',String(coins()-n));try{window.dispatchEvent(new Event('storage'));window.updBar&&updBar()}catch(e){}return true};
let cur=localStorage.getItem('vt_dance')||'idle';
const el=document.getElementById('lbav'),fig=el.querySelector('.fig');
function ok(id){if(id==='idle')return true;const r=J()[id];return r&&r.until>Date.now()&&r.plays<CAP}
let sv=0;function set(id){if(!ok(id))id='idle';const ch=id!==cur;cur=id;localStorage.setItem('vt_dance',id);fig.className='fig dn-'+id;if(ch){clearTimeout(sv);sv=setTimeout(()=>{try{AV.putx({dance:id})}catch(e){}},1500)}}
fig.addEventListener('animationiteration',()=>{if(cur==='idle')return;const o=J(),r=o[cur];if(!r)return set('idle');r.plays++;SV(o);if(r.plays>=CAP){const id=cur;set('idle');cap(id)}});
function cap(id){const n=D[id][1],hasAd=!!(window.ADS&&ADS.reward&&window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData);
 VTDLG('<h3>💃 '+D[id][0]+'</h3><p>Tu avatar se ha cansado.'+(hasAd?' Mira un anuncio para seguir bailando, o paga '+EXTRA+' monedas.':' Paga '+EXTRA+' monedas para seguir bailando.')+'</p>',[['Ahora no',null,'sec'],...(hasAd?[['📺 Ver anuncio',async()=>{const prev=window.VT_GAME;window.VT_GAME='baile';let v=false;try{v=await ADS.reward('dance')}catch(e){}window.VT_GAME=prev;if(v){const o=J();if(o[id]){o[id].plays=0;SV(o)}set(id)}}]]:[]),['🪙 Pagar '+EXTRA,()=>{if(pay(EXTRA)){const o=J();if(o[id]){o[id].plays=0;SV(o)}set(id)}else VTDLG('<p>No tienes monedas suficientes.</p>',[['Vale']])}]])}
function picker(){let p=document.getElementById('dnp');if(p){p.remove();return}p=document.createElement('div');p.id='dnp';const o=J();
 p.innerHTML='<b>💃 Bailes</b> <small>(alquiler 24 h · 🪙 '+coins()+')</small>'+Object.keys(D).map(k=>{const r=o[k],act=k==='idle'||(r&&r.until>Date.now());return '<div class="r"><span>'+D[k][0]+(act&&k!=='idle'?' <small>⏳ '+Math.ceil((r.until-Date.now())/36e5)+' h · '+(CAP-r.plays)+' usos</small>':'')+'</span><button type="button" data-k="'+k+'" class="'+(cur===k?'on':'')+'">'+(act?(cur===k?'Bailando':'Usar'):'🪙 '+D[k][1])+'</button></div>'}).join('');document.body.appendChild(p);
 p.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k,r=J()[k];if(k==='idle'||(r&&r.until>Date.now())){if(r&&r.plays>=CAP){p.remove();return cap(k)}set(k);p.remove();return}
  VTDLG('<h3>💃 '+D[k][0]+'</h3><p>¿Alquilar este baile 24 horas por <b>'+D[k][1]+'</b> monedas?</p>',[['Cancelar',null,'sec'],['Alquilar',()=>{if(!pay(D[k][1]))return VTDLG('<p>No tienes monedas suficientes.</p>',[['Vale']]);const o=J();o[k]={until:Date.now()+DAY,plays:0};SV(o);set(k)}]])})}
document.getElementById('dnb').onclick=picker;document.getElementById('amgb').onclick=()=>{try{AMIGOS.toggle()}catch(e){}};
function face(){let u=null;try{u=AV.mine()}catch(e){}const h=u?'<img src="'+u+'" alt="">':(window.TOKS?TOKS.svg(TOKS.get()||'mago'):'');if(fig.dataset.h!==h){fig.dataset.h=h;fig.innerHTML=h}}
setInterval(()=>{const lb=document.getElementById('lobby');const v=lb&&getComputedStyle(lb).display!=='none';const tp=document.getElementById('tip'),tipOn=tp&&getComputedStyle(tp).display!=='none';el.style.display=v&&!tipOn?'flex':'none';if(!v){const p=document.getElementById('dnp');p&&p.remove()}else face()},700);
set(cur);
/* emote al enviar un mensaje */
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#chats')){const m=el.querySelector('.emo');m.textContent=['💬','😄','👋','🎉','😂'][Math.floor(Math.random()*5)];m.classList.remove('on');void m.offsetWidth;m.classList.add('on');setTimeout(()=>m.classList.remove('on'),1400)}},true);
})();</script>

<!-- ===== Amigos del pueblo: chat con jugadores con los que ya has jugado ===== -->
<style>#amgb{min-height:44px}#amg{position:fixed;right:8px;left:auto;bottom:calc(var(--bot,0px) + 66px);z-index:10004;width:min(94vw,360px);max-height:min(70vh,520px);display:none;flex-direction:column;background:rgba(27,31,58,.96);color:#fff;border:3px solid #f4e9c8;border-radius:16px;box-shadow:0 0 0 3px #1a1c28;font:13px Arial,sans-serif;overflow:hidden}
#amg header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(0,0,0,.3);font:15px 'MedievalSharp',serif}#amg header button{min-height:40px;min-width:40px;border-radius:10px;border:2px solid #f4e9c8;background:#3b3f55;color:#fff}
#amg .fl{display:flex;gap:8px;overflow-x:auto;padding:8px;border-bottom:1px solid rgba(255,255,255,.15);min-height:96px}
#amg .fr{flex:0 0 72px;text-align:center;font-size:11px;position:relative}#amg .fr .fig{width:52px;height:60px;margin:0 auto;transform-origin:50% 100%}#amg .fr .fig img,#amg .fr .fig svg{width:100%;height:100%;object-fit:contain}
#amg .fr .dot{position:absolute;top:2px;right:8px;width:10px;height:10px;border-radius:50%;background:#888;border:2px solid #1a1c28}#amg .fr .dot.on{background:#7cf25a}
#amg .fr button{min-height:30px;font-size:10px;border-radius:8px;border:1px solid #f4e9c8;background:#555a7a;color:#fff;margin-top:2px}#amg .fr.bl{opacity:.45}
#amg .ms{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;min-height:120px}#amg .m{background:rgba(255,255,255,.08);border-radius:10px;padding:4px 8px}#amg .m b{color:#ffd76a}
#amg form{display:flex;gap:6px;padding:8px}#amg input{flex:1;min-height:44px;border-radius:10px;border:2px solid #f4e9c8;padding:0 8px;font-size:15px}#amg form button{min-height:44px;min-width:56px;border-radius:10px;border:2px solid #1a1c28;background:#ffd76a;font:14px "Arial Black",sans-serif}
#amg .em{opacity:.7;padding:10px;text-align:center}</style>
<div id="amg"><header><b>👥 Amigos del pueblo</b><button type="button" id="amgx" aria-label="Cerrar">✕</button></header><div class="fl"></div><div class="ms"></div><form id="amgf"><input id="amgi" maxlength="300" placeholder="Escribe a tus amigos…" autocomplete="off"><button id="amgs" type="submit">Enviar</button></form></div>
<script>(function(){
const FN='https://nlkltjywdupkqiwctzpr.supabase.co/functions/v1/chat',tg=window.Telegram&&Telegram.WebApp;let u={};try{u=tg.initDataUnsafe.user||{}}catch(e){}
const me=u.id||+localStorage.getItem('vt_web_id');
const call=o=>fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({initData:(tg&&tg.initData)||'',tg_id:me,name:u.first_name||'Jugador',avatar:u.photo_url||''},o))}).then(r=>r.json()).catch(()=>({error:'red'}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=document.getElementById('amg'),FL=P.querySelector('.fl'),MS=P.querySelector('.ms');let open=false,timer=null,fr=[];
function fig(id){let h='';try{const a=AV.get(id);if(a)h='<img src="'+a+'" alt="">'}catch(e){}const r=(window.AV&&AV.raw&&AV.raw(id))||{};if(!h&&window.TOKS)h=TOKS.svg(r.token||'mago');return '<div class="fig dn-'+esc(/^[a-z]{2,12}$/.test(r.dance||'')?r.dance:'idle')+'">'+h+'</div>'}
function drawF(){FL.innerHTML=fr.length?fr.map(f=>'<div class="fr'+(f.blocked?' bl':'')+'"><i class="dot'+(f.online?' on':'')+'"></i>'+fig(f.id)+'<div>'+esc(f.name)+'</div><button type="button" data-b="'+f.id+'" data-x="'+(f.blocked?'unblock':'block')+'">'+(f.blocked?'Desbloquear':'Bloquear')+'</button></div>').join(''):'<div class="em">Aún no tienes amigos del pueblo. Juega una partida en sala y los jugadores aparecerán aquí.</div>';
FL.querySelectorAll('button').forEach(b=>b.onclick=async()=>{if(b.dataset.x==='block'&&!confirm('¿Bloquear a este jugador? No verás sus mensajes ni él los tuyos.'))return;await call({action:b.dataset.x,target:+b.dataset.b});load()})}
async function load(){const r=await call({action:'friends'});if(r.ok){fr=r.friends||[];try{AV.drop&&AV.drop(fr.map(f=>f.id));await AV.load(fr.map(f=>f.id))}catch(e){}drawF()}const m=await call({scope:'amigos',action:'read'});if(m.ok){const at=MS.scrollTop+MS.clientHeight>=MS.scrollHeight-20;MS.innerHTML=(m.messages||[]).map(x=>'<div class="m"><b>'+esc(+x.telegram_id===+me?'Tú':x.player_name)+':</b> '+esc(x.message)+'</div>').join('')||'<div class="em">Sin mensajes en las últimas 24 h.</div>';if(at)MS.scrollTop=MS.scrollHeight}}
function show(v){open=v;P.style.display=v?'flex':'none';clearInterval(timer);if(v){load();timer=setInterval(()=>{if(!document.hidden)load()},6000)}}
document.getElementById('amgx').onclick=()=>show(false);
document.getElementById('amgf').onsubmit=async e=>{e.preventDefault();const i=document.getElementById('amgi'),t=i.value.trim();if(!t)return;i.value='';const r=await call({scope:'amigos',message:t});if(r.error==='no friends')MS.insertAdjacentHTML('beforeend','<div class="em">Necesitas haber jugado con alguien para escribir aquí.</div>');else if(r.error==='slow down')i.value=t;load();try{const m=document.querySelector('#lbav .emo');m.textContent='💬';m.classList.remove('on');void m.offsetWidth;m.classList.add('on');setTimeout(()=>m.classList.remove('on'),1400)}catch(_){}};
window.AMIGOS={toggle:()=>show(!open),close:()=>show(false)};
/* presencia: aviso al servidor cada 45 s mientras la app está visible */
const ping=()=>{if(!document.hidden&&me)call({action:'ping'})};ping();setInterval(ping,45000);document.addEventListener('visibilitychange',ping);
setInterval(()=>{const lb=document.getElementById('lobby');if(open&&!(lb&&getComputedStyle(lb).display!=='none'))show(false)},1000);
})();</script>
