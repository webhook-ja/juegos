<script>/* Monetag TMA ads helper (main zone 12014079) */window.ADS=(function(){var Z='show_12014079',CAP=15;
function k(){return 'ads_'+new Date().toISOString().slice(0,10)}
function n(){try{return +(localStorage.getItem(k())||0)}catch(e){return 0}}function inc(){try{localStorage.setItem(k(),n()+1)}catch(e){}}
function uid(){try{var u=Telegram.WebApp.initDataUnsafe.user;if(u&&u.id)return 'tg-'+u.id+'-'+Date.now()}catch(e){}return 'web-'+Date.now()}
function ok(){return typeof window[Z]==='function'&&n()<CAP}
function valued(r){return !!(r&&r.reward_event_type==='valued')}
function reward(tag){if(!ok())return Promise.resolve(false);inc();var id=uid();
return window[Z]({type:'preload',ymid:id}).then(function(){return window[Z]({ymid:id,requestVar:tag})}).then(valued).catch(function(){return false})}
function pop(tag){if(!ok())return Promise.resolve(false);inc();return window[Z]({type:'pop',ymid:uid(),requestVar:tag}).then(valued).catch(function(){return false})}
function inter(){if(!ok())return Promise.resolve();inc();return window[Z]({type:'preload'}).then(function(){return window[Z]()}).then(function(){},function(){})}
function inApp(){if(typeof window[Z]!=='function')return;window[Z]({type:'inApp',inAppSettings:{frequency:1,capping:0.5,interval:180,timeout:30,everyPage:false}}).catch(function(){})}
try{window.Telegram&&Telegram.WebApp&&Telegram.WebApp.ready()}catch(e){}
return{ok:ok,reward:reward,pop:pop,inter:inter,inApp:inApp}})();</script>

*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;user-select:none;font-family:"Arial Black",Impact,sans-serif;color:#fff;background:radial-gradient(circle at 50% 40%,#4aa3ff,#1b3f8f)}

.f{position:relative}.f svg{width:280px;height:330px}

.guard .gl{transform:translate(25px,-120px)}.guard .gr{transform:translate(-25px,-120px)}

.hit .pow{transform:translateX(-50%) scale(1) rotate(-10deg)}.blk .pow{transform:translateX(-50%) scale(.8);-webkit-text-stroke-color:#555;text-shadow:0 4px 0 #555}

<div class="top"><div class="pill">🔵 TÚ: <span id="s0">0</span></div><div class="pill">🎯 A 10</div><div class="pill">🔴 NEW BOT: <span id="s1">0</span></div></div>

<script>
function fighter(id,body,hair,band,name){return `<div class="f" id="${id}"><svg viewBox="0 0 280 330">
<ellipse cx="140" cy="318" rx="85" ry="10" fill="#0b1230" opacity=".4"/>
<rect x="80" y="200" width="120" height="110" rx="16" fill="${body}"/><rect x="80" y="270" width="120" height="16" fill="#ffc93c"/>
<g class="head"><rect x="60" y="30" width="160" height="165" rx="32" fill="#f4b183"/><rect x="60" y="30" width="160" height="42" rx="20" fill="${hair}"/><rect x="60" y="66" width="160" height="14" fill="${band}"/>
<g class="o"><rect x="98" y="100" width="20" height="24" rx="6" fill="#1b1b1b"/><rect x="162" y="100" width="20" height="24" rx="6" fill="#1b1b1b"/></g>
<g class="x" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"><path d="M98 102l20 20M118 102l-20 20M162 102l20 20M182 102l-20 20"/></g>
<rect x="131" y="122" width="18" height="20" rx="8" fill="#e8946a"/>
<ellipse class="bruise" cx="96" cy="146" rx="18" ry="12" fill="#7b2cbf"/><ellipse class="bruise" cx="184" cy="146" rx="18" ry="12" fill="#7b2cbf"/>
<rect x="112" y="158" width="56" height="13" rx="6" fill="#1b1b1b"/></g>
<g class="gl"><rect x="30" y="225" width="62" height="56" rx="22" fill="${band}"/></g><g class="gr"><rect x="188" y="225" width="62" height="56" rx="22" fill="${band}"/></g>
</svg><div class="pow">¡POW!</div><div class="name">${name}</div></div>`}
ring.innerHTML=fighter('me','#3a86ff','#3a2a1a','#1f6fd1','TÚ')+fighter('ai','#e63946','#222','#d81e36','NEW BOT');
const F=[me,ai],sc=[0,0],WIN=10;let over=false,busy=[false,false],A,aiT;
function tone(f1,f2,d,t){A=A||new AudioContext();const o=A.createOscillator(),g=A.createGain();o.type=t;o.frequency.setValueAtTime(f1,A.currentTime);o.frequency.exponentialRampToValueAtTime(f2,A.currentTime+d);g.gain.setValueAtTime(.22,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}
function punch(p,side){if(over||busy[p])return;busy[p]=true;const a=F[p],d=F[1-p];a.classList.remove('guard');a.classList.add('p'+side);
setTimeout(()=>{const blocked=d.classList.contains('guard');
if(blocked){d.classList.add('blk');d.querySelector('.pow').textContent='¡BLOQ!';tone(300,250,.08,'triangle')}
else{sc[p]++;document.getElementById('s'+p).textContent=sc[p];d.querySelector('.pow').textContent='¡POW!';d.classList.add('hit');tone(200,50,.15,'square');
const n=sc[p];d.classList.toggle('b1',n>=3);d.classList.toggle('b2',n>=7);if(n>=WIN){d.classList.add('ko');finish(p)}}
setTimeout(()=>{a.classList.remove('pL','pR');d.classList.remove('hit','blk');busy[p]=false},180)},90)}
function finish(p){over=true;clearTimeout(aiT);tone(400,80,.7,'sawtooth');setTimeout(()=>{et.innerHTML=p==0?'¡GANASTE! 🏆':'¡GANA NEW BOT! 🤖';end.style.display='flex';adrv.style.display=(p==1&&ADS.ok()&&!window._rv)?'':'none'},700)}
function aiLoop(){if(over)return;aiT=setTimeout(()=>{const r=Math.random();
if(r<.25){ai.classList.add('guard');setTimeout(()=>ai.classList.remove('guard'),500+Math.random()*500)}else punch(1,Math.random()<.5?'L':'R');aiLoop()},450+Math.random()*1100)}
// player guard: hold down arrow or both sides
onkeydown=e=>{if(e.repeat)return;if(e.key=='ArrowLeft')punch(0,'L');if(e.key=='ArrowRight')punch(0,'R');if(e.key=='ArrowDown'||e.key==' ')me.classList.add('guard')};
onkeyup=e=>{if(e.key=='ArrowDown'||e.key==' ')me.classList.remove('guard')};
zl.onpointerdown=()=>punch(0,'L');zr.onpointerdown=()=>punch(0,'R');
rb.onclick=()=>{window._rv=0;adrv.style.display='none';sc[0]=sc[1]=0;s0.textContent=s1.textContent=0;F.forEach(f=>f.className='f');over=false;busy=[false,false];end.style.display='none';aiLoop()};adrv.style.display='none';window._rv=0;
adrv.onclick=async()=>{adrv.disabled=true;if(await ADS.reward('boxeo_second_chance')){window._rv=1;sc[1]=WIN-3;s1.textContent=sc[1];F.forEach(f=>f.classList.remove('ko'));over=false;busy=[false,false];end.style.display='none';aiLoop()}adrv.disabled=false;adrv.style.display='none'};
aiLoop();
</script><script>window.VT_SRC={}</script>

<script>/* barra de puntos compartida: vt_tokens / vt_coins (solo lectura del juego) */
(function(){function g(k){try{return +(localStorage.getItem(k)||0)}catch(e){return 0}}function s(k,v){try{localStorage.setItem(k,Math.max(0,v))}catch(e){}}
var bar=document.getElementById('vtbar'),src=window.VT_SRC||{},last={};var tu={};try{tu=(Telegram.WebApp.initDataUnsafe||{}).user||{}}catch(e){}var nm=(tu.first_name||'Jugador').replace(/[<>&"]/g,'');
var av=tu.photo_url&&/^https:\/\//.test(tu.photo_url)?'<img src="'+tu.photo_url.replace(/"/g,'')+'" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #ffd23f">':'<span style="width:30px;height:30px;border-radius:50%;background:#e63946;border:2px solid #ffd23f;display:inline-flex;align-items:center;justify-content:center">'+nm[0].toUpperCase()+'</span>';
var head=av+' <span>'+nm+'</span>';

function tick(){var parts=[];for(var key in src){var cur;try{cur=src[key].get()}catch(e){continue}
if(src[key].sync){if(last[key]!==undefined&&cur!==last[key])s(src[key].sync,g(src[key].sync)+(cur-last[key]));last[key]=cur}
if(src[key].label)parts.push(src[key].label+' <b>'+cur+'</b>')}
bar.innerHTML=head+' · '+parts.concat(['🎟 total <b>'+g('vt_tokens')+'</b>','🪙 total <b>'+g('vt_coins')+'</b>']).join(' · ')}
tick();setInterval(tick,250)})();</script>
